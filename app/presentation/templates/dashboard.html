<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ app_name }}</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body class="dashboard-display-body">
    <main class="dashboard-display-main" aria-label="Dashboard">
      <article class="dashboard-display-card" aria-label="Virtual display card">
        <div class="tamagotchi-shell" aria-hidden="true">
          <div class="tamagotchi-screen-window">
            <img
              id="dashboard-display-frame"
              src="/api/display/frame.png?v={{ frame_meta.version }}"
              alt="Live mirrored pet display"
              width="{{ capabilities.width }}"
              height="{{ capabilities.height }}"
              data-frame-url="/api/display/frame.png"
              data-meta-url="/api/display/frame.meta"
              data-ws-url="/ws/display"
              data-version="{{ frame_meta.version }}"
            />
          </div>

          <div class="tamagotchi-buttons" aria-hidden="true">
            <span class="tamagotchi-button"></span>
            <span class="tamagotchi-button"></span>
            <span class="tamagotchi-button"></span>
          </div>
        </div>
      </article>
    </main>

    <script src="/static/dashboard_display.js" defer></script>
  </body>
</html>
