{% extends "base.html" %}

{% block content %}
<section class="dashboard-display-main" aria-label="Dashboard display mirror">
  <article class="dashboard-display-card" aria-label="Virtual display card">
    <div class="tamagotchi-shell">
      <div class="tamagotchi-screen-window">
        <img
          id="dashboard-display-frame"
          src="/api/display/frame.png?v={{ frame_meta.version }}"
          alt="Live mirrored pet display"
          width="{{ capabilities.width }}"
          height="{{ capabilities.height }}"
          data-frame-url="/api/display/frame.png"
          data-meta-url="/api/display/frame.meta"
          data-ws-url="/ws/display"
          data-version="{{ frame_meta.version }}"
        />
      </div>

      <div class="tamagotchi-buttons" aria-hidden="true">
        <span class="tamagotchi-button"></span>
        <span class="tamagotchi-button"></span>
        <span class="tamagotchi-button"></span>
      </div>
    </div>

    <div class="dashboard-virtual-controls" aria-label="Virtual hardware buttons">
      <button type="button" class="virtual-control-button" data-button="BACK" aria-label="Back">BACK</button>
      <button type="button" class="virtual-control-button" data-button="NEXT" aria-label="Next">NEXT</button>
      <button type="button" class="virtual-control-button" data-button="CONFIRM" aria-label="Confirm">OK</button>
      <button type="button" class="virtual-control-button" data-button="SPECIAL" aria-label="Special">SP</button>
    </div>
  </article>
</section>

<script src="/static/dashboard_display.js" defer></script>
{% endblock %}
